# Dev reverse proxy. Production adds TLS termination, rate limits and
# security headers in Phase 17 — this file is not a production config.
upstream rahi_api { server api:3001; }
upstream rahi_admin { server admin-web:3000; }

server {
  listen 80;
  location /api/ { proxy_pass http://rahi_api; proxy_set_header Host $host; }
  location / { proxy_pass http://rahi_admin; proxy_set_header Host $host; }
}
