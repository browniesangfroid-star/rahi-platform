version: 0.5.0+1
environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.0.0
  flutter_secure_storage: ^9.0.0
  http: ^1.2.0
  provider: ^6.1.0
  socket_io_client: ^3.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
