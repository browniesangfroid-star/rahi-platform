name: rahi_customer
description: Rahi customer app — car, bike and delivery booking, driver offers, live trip tracking with PIN, wallet, ratings, SOS and support against the live Rahi API.
version: 1.0.0+1
environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.0
  flutter_secure_storage: ^9.0.0
  geolocator: ^13.0.0
  http: ^1.2.0
  latlong2: ^0.9.0
  provider: ^6.1.0
  socket_io_client: ^3.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
